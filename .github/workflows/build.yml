name: Build EITPass (Windows x64)

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Reviewed upstream branch, tag, or SHA'
        required: true
        default: 'master'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'scripts/**'
      - 'branding/**'
      - 'installer/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout EITPass
        uses: actions/checkout@v4
      - name: Checkout Passbolt Windows
        uses: actions/checkout@v4
        with:
          repository: passbolt/passbolt-windows
          ref: ${{ github.event.inputs.upstream_ref || 'master' }}
          path: upstream
          persist-credentials: false
          submodules: recursive
      - name: Apply EITPass package branding
        shell: pwsh
        run: ./scripts/apply-branding.ps1 -Root upstream
      - name: Record upstream revision
        shell: pwsh
        run: |
          git -C upstream rev-parse HEAD | Out-File upstream-commit.txt
      - name: Inspect solution and packaging projects
        shell: pwsh
        run: |
          Get-ChildItem upstream -Recurse -Include *.sln,*.slnx,*.wapproj,*.appxmanifest,*.msix -File |
            Select-Object -ExpandProperty FullName
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Locate application project
        id: application
        shell: pwsh
        run: |
          $project = Join-Path (Resolve-Path upstream).Path 'passbolt/passbolt-windows.csproj'
          if (-not (Test-Path -LiteralPath $project -PathType Leaf)) {
            throw "Expected application project not found: $project"
          }
          Write-Host "Building application project without unrelated test project: $project"
          "path=$project" >> $env:GITHUB_OUTPUT
      - name: Restore
        shell: pwsh
        run: |
          msbuild "${{ steps.application.outputs.path }}" /t:Restore /m /p:Configuration=Release /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned Windows package
        shell: pwsh
        run: |
          msbuild "${{ steps.application.outputs.path }}" /t:Build /m /p:Configuration=Release /p:Platform=x64 /p:AppxPackageSigningEnabled=false /p:GenerateAppxPackageOnBuild=true /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxPackageDir="$env:GITHUB_WORKSPACE\artifacts\"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect outputs and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $packages = @(Get-ChildItem upstream,artifacts -Recurse -File -Include *.msix,*.msixbundle,*.appx,*.appxbundle | Sort-Object FullName -Unique)
          if ($packages.Count -eq 0) {
            throw 'No installable MSIX/AppX package produced. Inspect packaging configuration.'
          }
          foreach ($file in $packages) {
            if (-not $file.FullName.StartsWith((Resolve-Path artifacts).Path)) {
              Copy-Item $file.FullName -Destination artifacts -Force
            }
          }
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $(Split-Path $_.Path -Leaf)" } |
            Set-Content artifacts/SHA256SUMS.txt
          Copy-Item upstream-commit.txt artifacts/
      - name: Build EXE bootstrapper for MSIX/AppX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Get-ChildItem artifacts -Recurse -File | Where-Object { $_.Extension -in @('.msix', '.appx') -and $_.Name -match 'passbolt-windows|EITPass' -and $_.FullName -notmatch '[\\/]Dependencies[\\/]' } | Sort-Object @{Expression={ if ($_.Extension -eq '.msix') { 0 } else { 1 } }} | Select-Object -First 1
          if (-not $package) { throw 'No MSIX/AppX package available for EXE bootstrapper.' }
          $packagePath = $package.FullName
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          $payloadExtension = $package.Extension
          Copy-Item $packagePath "installer/payload/EITPass$payloadExtension" -Force
          $source = @'
          using System;
          using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          class Installer {
            [STAThread] static int Main() {
              string path = Path.Combine(Path.GetTempPath(), "EITPass-" + Guid.NewGuid().ToString("N") + "__PACKAGE_EXTENSION__");
              try {
                using (var input = Assembly.GetExecutingAssembly().GetManifestResourceStream("EITPassPackage")) {
                  if (input == null) throw new Exception("Embedded package missing");
                  using (var output = File.Create(path)) input.CopyTo(output);
                }
                var psi = new ProcessStartInfo("powershell.exe", "-NoProfile -ExecutionPolicy Bypass -Command \"Add-AppxPackage -Path '" + path.Replace("'", "''") + "'\"");
                psi.UseShellExecute = true; psi.Verb = "runas";
                using (var p = Process.Start(psi)) { p.WaitForExit(); return p.ExitCode; }
              } catch (Exception ex) { Console.Error.WriteLine(ex); return 1; }
              finally { try { File.Delete(path); } catch {} }
            }
          }
          '@
          $source = $source.Replace('__PACKAGE_EXTENSION__', $payloadExtension)
          Set-Content installer/EITPassInstaller.cs $source
          $csc = (Get-ChildItem 'C:\Windows\Microsoft.NET\Framework64' -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $csc) { throw 'C# compiler missing' }
          $sourcePath = (Resolve-Path installer/EITPassInstaller.cs).Path
          $resourcePath = (Resolve-Path "installer/payload/EITPass$payloadExtension").Path
          $exePath = Join-Path (Resolve-Path artifacts).Path "EITPass.exe"
          & $csc /nologo /target:exe "/out:$exePath" "/resource:$resourcePath,EITPassPackage" "$sourcePath"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash artifacts/EITPass.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  EITPass.exe" } | Add-Content artifacts/SHA256SUMS.txt
      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: eitpass-windows-x64-unsigned-branded-manifest
          path: artifacts/
          if-no-files-found: error
